<div class=" d-flex flex-column justify-content-center align-items-center vh-auto bg-light">

    <!-- @if(!validLogin){
    <div class="alert alert-danger mb-3">
            Invalid Credentials
    </div>

    } -->
    @if(invalidLogin()){
    <p class="text-muted mb-0 alert">Invalid Credentials</p>
    }


    <div class="card shadow-lg p-4 rounded-4" style="width: 500px;">
        <form (ngSubmit)="handleLogin()">
            <div class="form-group">
                <label for="exampleInputUsername">Username</label>
                <input type="text" class="form-control" id="username" name="username" [(ngModel)]="username"
                    autocomplete="off">
                <!-- <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small> -->
            </div>
            <div class="form-group">
                <label for="exampleInputPassword1">Password</label>
                <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
            </div>
            <button type="submit" class="btn btn-success">Login</button>
        </form>
    </div>

</div>
